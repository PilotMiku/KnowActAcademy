<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f7ff" />
    <meta
      name="description"
      content="知行学习 高等数学、线性代数题库与习概知识点，随机刷题、加权备考、章节练习、模拟考试和知识复习。"
    />
    <title>知行学习 · 刷题与复习</title>
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./vendor/katex/katex.min.css" />
    <script>
      try {
        const key = "zhixing-ui:" + new URL("./", location.href).pathname;
        const choice = JSON.parse(localStorage.getItem(key) || "{}").theme || "system";
        const dark = choice === "dark" || choice === "system" && matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./welcome.css" />
    <script defer src="./vendor/katex/katex.min.js"></script>
    <script defer src="./vendor/katex/auto-render.min.js"></script>
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <aside id="storage-conflict" class="storage-conflict" role="alert" hidden>
      <strong>其他页面已更新学习记录</strong>
      <p>此页已暂停编辑，避免覆盖新记录。如有尚未保存的内容，可以先导出此页备份。</p>
      <div class="flex"><button type="button" class="btn" id="export-stale-page">导出此页备份</button><button type="button" class="btn primary" id="reload-latest">加载最新记录</button></div>
    </aside>
    <div id="app">
      <div class="boot">
        <span class="boot-mark">∑</span>
        <p>正在加载知行学习题库…</p>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <input id="file-input" type="file" accept=".json,application/json" hidden />
    <noscript>知行学习需要 JavaScript 才能保存练习进度和进行答题。</noscript>
  </body>
</html>
