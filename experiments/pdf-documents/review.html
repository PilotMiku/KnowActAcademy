<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知行学习 · 题库逐题校对</title>
<link rel="stylesheet" href="../../dist/vendor/katex/katex.min.css">
<style>
*{box-sizing:border-box}body{margin:0;color:#24312c;background:#f4f6f3;font:15px/1.7 system-ui,sans-serif}header{padding:20px 4vw;background:#fff;border-bottom:1px solid #d9e2db;position:sticky;top:0;z-index:1}h1{margin:0;font-size:21px}p{margin:6px 0}main{max-width:1500px;margin:auto;padding:24px 4vw}button,input,select{font:inherit;padding:7px 12px;border:1px solid #bacac1;border-radius:7px;background:white}button{cursor:pointer}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}#search{flex:1;min-width:200px}.muted{color:#66766d;font-size:13px}.part{background:#fff;border:1px solid #d9e2db;border-radius:10px;margin:18px 0;padding:20px}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.source img{max-width:100%;height:auto}.native{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}.badge{border-radius:5px;padding:3px 8px;background:#fff0d9;color:#815600;font-size:12px}.checked{background:#e0f3e8;color:#226443}.error{background:#fde2dd;color:#9d382d}details{font-size:12px;margin-top:15px;overflow-wrap:anywhere}summary{cursor:pointer}.formula-list{display:grid;gap:10px}.formula-list img{max-width:100%;max-height:130px}#empty{padding:50px}a{color:#27634a}.katex-display{overflow:auto}@media(max-width:800px){.columns{grid-template-columns:1fr}header{position:static}.part{padding:14px}}
</style>
<header><h1>知行学习 · 题库逐题校对</h1><p class="muted" id="progress">正在加载本机转写稿…</p><nav><select id="edition"><option value="original">原 PDF 版</option><option value="supplement">NEU 补充版</option></select><select id="status"><option value="all">全部题目</option><option value="pending">待检查</option><option value="checked">来源比对已通过</option><option value="source-error">原题勘误</option></select><input id="search" placeholder="题号、章节或题干关键词" aria-label="搜索题目"><button id="previous">上一题</button><button id="next">下一题</button></nav></header>
<main><div id="position" class="muted"></div><h2 id="title"></h2><p id="metadata"></p><div id="parts"></div></main>
<script src="../../dist/vendor/katex/katex.min.js"></script><script src="../../dist/vendor/katex/auto-render.min.js"></script>
<script type="module">
const $=s=>document.querySelector(s),root=new URL('../../',location.href);
const labels={stem:'题干',analysis:'解析','option-A':'选项 A','option-B':'选项 B','option-C':'选项 C','option-D':'选项 D'};
const statuses={'source-checked':'已与来源比对','review-required':'待比对','raster-review-required':'图片转写待比对','source-answer-error':'原题答案或解析有错误','not-transcribed':'尚未转写','source-image-missing':'原文件图片缺失'};
let banks={},filtered=[],position=0;
function escape(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filter(){const query=$('#search').value.trim().toLowerCase(),status=$('#status').value;filtered=banks[$('#edition').value].questions.filter(q=>{const parts=Object.values(q.transcription.parts),checked=parts.every(p=>p.status==='source-checked');return (!query||`${q.id} ${q.sourceLabel||q.chapterLabel} ${q.stem}`.toLowerCase().includes(query))&&(status==='all'||status==='checked'&&checked||status==='pending'&&!checked||status==='source-error'&&parts.some(p=>p.status==='source-answer-error'));});position=0;show();}
function show(){const q=filtered[position];$('#position').textContent=filtered.length?`${position+1} / ${filtered.length}`:'没有符合条件的题目';$('#parts').replaceChildren();if(!q){$('#title').textContent='';$('#metadata').textContent='';return;}$('#title').textContent=q.sourceLabel||`${q.chapterLabel} · 第 ${q.sourceNumber} 题`;$('#metadata').textContent=`${q.id} · 原文件标记答案 ${q.answer}`;for(const [name,part]of Object.entries(q.transcription.parts)){const section=document.createElement('section');section.className='part';const verified=part.status==='source-checked',err=part.status==='source-answer-error';section.innerHTML=`<p><b>${escape(labels[name]||name)}</b> <span class="badge ${verified?'checked':err?'error':''}">${escape(statuses[part.status]||part.status)}</span></p><div class="columns"><div><p class="muted">文字与 LaTeX</p><div class="native"></div></div><div class="source"><p class="muted">原始内容</p></div></div>`;section.querySelector('.native').textContent=part.text||'暂无文字';const source=section.querySelector('.source');const im=document.createElement('img');im.loading='lazy';im.alt='原始题目内容';const imageId=part.sourceImageId||part.rasterSource;if(imageId)im.src=new URL(`.cache/supplement-transcription/images/${imageId}.png`,root);else im.src=new URL(`.cache/pdf-ba8cf68633101d8c-raster-v2/${q.id}/${name}/0.webp`,root);im.onerror=()=>{im.replaceWith(document.createTextNode('本地原图未生成，请从 question-bank 打开来源文件。'));};source.append(im);const failures=(part.evidence||[]).filter(e=>e.kind==='formula'&&!['source-contours-checked','manually-reviewed'].includes(e.status));if(failures.length){const details=document.createElement('details');details.innerHTML=`<summary>${failures.length} 处公式需要校对</summary><div class="formula-list"></div>`;for(const item of failures){const row=document.createElement('div');const img=document.createElement('img');img.src=new URL(`.cache/pdf-transcription/crops/${item.id}.png`,root);img.loading='lazy';row.append(img);const pre=document.createElement('pre');pre.textContent=item.text||'[无候选文字]';row.append(pre);details.querySelector('div').append(row);}section.append(details);}if(part.manualReview?.sourceErratum){const note=document.createElement('p');note.className='badge error';note.textContent='已记录原文勘误，请核对原题选项。';section.append(note);}$('#parts').append(section);renderMathInElement(section.querySelector('.native'),{delimiters:[{left:'\\(',right:'\\)',display:false}],throwOnError:false,trust:false,maxExpand:500,maxSize:10});}$('#previous').disabled=position===0;$('#next').disabled=position===filtered.length-1;}
try{const [original,supplement,progress]=await Promise.all(['original-native-draft.json','supplement-native-draft.json','progress.json'].map(async f=>{const r=await fetch(f);if(!r.ok)throw Error(`缺少 ${f}，请先运行 assemble.py`);return r.json();}));banks={original,supplement};$('#progress').textContent=`原版 ${progress.originalQuestions} 题，补充版 ${progress.supplementQuestions} 题。原版 ${progress.originalFullySourceChecked} 题完成全部内容的来源比对。此页面为校对稿，待检查内容尚未替换正式题库。`;filter();}catch(e){$('#progress').textContent=e.message;}
for(const id of ['edition','status'])$('#'+id).addEventListener('change',filter);$('#search').addEventListener('input',filter);$('#previous').onclick=()=>{if(position>0){position--;show();}};$('#next').onclick=()=>{if(position<filtered.length-1){position++;show();}};
</script></html>
