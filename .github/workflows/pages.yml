name: Deploy 知行学习 to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install build and test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Verify core behavior and original content
        run: |
          python scripts/check_bank.py
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Build complete static question bank
        run: python scripts/build_static.py
      - name: Verify every static resource
        run: python scripts/verify_site.py
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser regression with repository prefix
        run: npm run test:browser
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
